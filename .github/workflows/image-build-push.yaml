---
name: Image Build and Push

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  validate:
    name: Validate image
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Read Rust channel
        run: |
          python3 <<'EOF' >"$GITHUB_ENV"
          import tomllib
          from pathlib import Path

          rust_toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())
          print(f"RUST_VERSION={rust_toolchain['toolchain']['channel']}")
          EOF

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          build-args: RUST_VERSION=${{ env.RUST_VERSION }}
          cache-from: type=gha,scope=${{ github.repository }}-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-${{ github.ref }}
          file: Containerfile
          platforms: linux/amd64
          push: false

  publish:
    name: Publish image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write  # Authenticate the published image with Sigstore Fulcio.
      packages: write  # Publish the image to GitHub Container Registry.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Read Rust channel
        run: |
          python3 <<'EOF' >"$GITHUB_ENV"
          import tomllib
          from pathlib import Path

          rust_toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())
          print(f"RUST_VERSION={rust_toolchain['toolchain']['channel']}")
          EOF

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          build-args: RUST_VERSION=${{ env.RUST_VERSION }}
          cache-from: type=gha,scope=${{ github.repository }}-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-${{ github.ref }}
          file: Containerfile
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: true
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Sign published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE_NAME@$DIGEST"
